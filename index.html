<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRVATINO - Feedback Survey</title>
    
    <!-- Google Font for retro pixel look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background Retro Stars -->
<div class="stars">
    <div class="pixel-star star1">✦</div>
    <div class="pixel-star star2">✦</div>
    <div class="pixel-star star3">+</div>
    <div class="pixel-star star4">✦</div>
    <div class="pixel-star star5">✚</div>
    <div class="pixel-star star6">+</div>
    <div class="pixel-star star7">✦</div>
    <div class="pixel-star star8">✚</div>
    <div class="pixel-star star9">+</div>
    <div class="pixel-star star10">✦</div>
    
    <div class="small-star s1">*</div>
    <div class="small-star s2">*</div>
    <div class="small-star s3">*</div>
    <div class="small-star s4">*</div>
    <div class="small-star s5">*</div>
    <div class="small-star s6">*</div>
    <div class="small-star s7">*</div>
    <div class="small-star s8">*</div>
    <div class="small-star s9">*</div>
    <div class="small-star s10">*</div>
</div>

<!-- MAIN LOGO IMAGE - REPLACES PURPLE TEXT -->
<div class="logo-container">
    <img src="trovatino-logo.png" alt="TROVATINO Logo" class="logo-img">
</div>

<!-- Main Content Area -->
<main class="survey-container">
    
    <!-- Question Section (dynamic via JavaScript) -->
    <section class="question-section" id="questionSection">
        <div id="questionContent"></div>
        
        <nav class="button-container">
            <button type="button" class="btn-back" onclick="goBack()">
                <span>← Back</span>
            </button>
            
            <button type="submit" class="btn-next" onclick="goNext()">
                <span>Next →</span>
            </button>
        </nav>
    </section>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 TROVATINO - We love feedback!</p>
    </footer>
</main>

<script src="survey.js"></script>
</body>
</html>
